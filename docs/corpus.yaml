depends:
  comm: github.com/cupogo/andvari/models/comm
  oid: github.com/cupogo/andvari/models/oid
  time: time

enums:

  - comment: 导入任务状态
    name: ImportTaskStatus
    start: 1
    type: int8
    values:
      - label: 排队中
        suffix: Pending
      - label: 处理中
        suffix: Processing
      - label: 已完成
        suffix: Succeeded
      - label: 已失败
        suffix: Failed
    stringer: true
    decodable: true
    textMarshaler: true
    textUnmarshaler: true

gename: corpus
modelpkg: corpus

models:
  - name: Document
    comment: '文档 语料库'
    tableTag: 'corpus_document,alias:cd'
    fields:
      - name: comm.DefaultModel
      - comment: 主标题 名称
        name: Title
        type: string
        tags: {json: 'title', pg: ',notnull,type:text,unique:corpus_title_heading_key'}
        isset: true
        query: 'match'
      - comment: 小节标题 属性 类别
        name: Heading
        type: string
        tags: {json: 'heading', pg: ',notnull,type:text,unique:corpus_title_heading_key'}
        isset: true
        query: 'match'
        sortable: true
      - comment: 内容 值
        name: Content
        type: string
        tags: {json: 'content', pg: ',notnull,type:text'}
        isset: true
        query: 'match'
      - type: comm.MetaField
    oidcat: article
    hooks:
      # beforeSaving: yes
      afterCreated: yes
      afterDeleting: yes
    hookNs: cob
    specNs: cob

  - name: DocVector
    comment: '文档向量 400=1024, 600=1536'
    tableTag: 'corpus_vector_400,alias:cv'
    fields:
      - name: comm.DefaultModel
      - comment: 文档编号
        name: DocID
        type: oid.OID
        tags: {json: 'docID', pg: 'doc_id,notnull'}
        basic: true
        query: 'equal'
      - comment: 主题 由名称+属性组成
        name: Subject
        type: string
        tags: {json: 'subject', pg: 'subject,notnull,type:text'}
        isset: true
        query: 'match'
        sortable: true
      - comment: 向量值 长为1024的浮点数集
        name: Vector
        type: 'Vector'
        tags: {json: 'vector,omitempty', pg: 'embedding,type:vector(1024)'}
        isset: true
      - comment: 相似度 仅用于查询结果
        name: Similarity
        type: float32
        tags: {json: 'similarity,omitempty', pg: '-'}
      - type: comm.MetaField
    oidcat: event
    # hooks:
    #   beforeSaving: yes
    hookNs: cob
    specNs: cob

  - name: DocMatch
    comment: '提示匹配结果'
    fields:
      - comment: 文档编号
        name: DocID
        type: oid.OID
        tags: { bun: 'doc_id', json: 'docID'}
      - comment: 提示
        name: Subject
        type: string
        tags: { bun: 'subject', json: 'subject'}
      - comment: 相似度
        name: Similarity
        type: float32
        tags: { bun: 'similarity', json: 'similarity,omitempty'}
    withPlural: true
    # export1: true
    # export2: true

  - name: ChatLog
    comment: '聊天日志 Deprecated'
    tableTag: 'qa_chat_log,alias:cl'
    fields:
      - name: comm.DefaultModel
      - comment: 会话ID
        name: ChatID
        type: oid.OID
        tags: {json: 'csid', pg: 'csid,notnull'}
        basic: true
        query: 'equal'
      - comment: 提问
        name: Question
        type: string
        tags: {json: 'prompt', pg: ',notnull,type:text'}
        isset: true
      - comment: 回答
        name: Answer
        type: string
        tags: {json: 'response', pg: ',notnull,type:text'}
        isset: true
      - type: comm.MetaField
    oidcat: event

  - name: ImportTask
    comment: '文档导入任务'
    tableTag: 'corpus_import,alias:ci'
    fields:
      - type: comm.DefaultModel
      - comment: 原始文件名
        name: Filename
        type: string
        tags: {json: 'filename', pg: ',notnull,type:varchar(255)'}
        isset: true
        query: 'match'
        sortable: true
      - comment: 任务状态
        name: Status
        type: ImportTaskStatus
        tags: {json: 'status', pg: ',notnull,type:smallint,default:1'}
        isset: true
        query: 'equal'
        sortable: true
      - comment: 原始 CSV 内容（worker 读取处理）
        name: Data
        type: string
        tags: {json: 'data,omitempty', pg: ',notnull,type:text'}
        isset: true
      - comment: 总数据行数
        name: Total
        type: int
        tags: {json: 'total', pg: ',notnull,default:0'}
        isset: true
      - comment: 成功行数
        name: Success
        type: int
        tags: {json: 'success', pg: ',notnull,default:0'}
        isset: true
      - comment: 失败行数
        name: Failed
        type: int
        tags: {json: 'failed', pg: ',notnull,default:0'}
        isset: true
      - comment: 跳过行数（重复行）
        name: Skipped
        type: int
        tags: {json: 'skipped', pg: ',notnull,default:0'}
        isset: true
      - comment: 失败明细
        name: Errors
        type: '[]ImportFailure'
        tags: {json: 'errors,omitempty', pg: ",notnull,type:jsonb,default:'[]'"}
        isset: true
      - comment: 开始处理时间
        name: StartedAt
        type: '*time.Time'
        tags: {json: 'startedAt,omitempty', pg: 'started_at,type:timestamptz'}
        isset: true
      - comment: 完成时间
        name: FinishedAt
        type: '*time.Time'
        tags: {json: 'finishedAt,omitempty', pg: 'finished_at,type:timestamptz'}
        isset: true
      - type: comm.MetaField
    oidcat: task
    specNs: cob

  - name: ImportFailure
    comment: '导入失败明细'
    fields:
      - comment: 行号（表头为第 1 行，数据从第 2 行起）
        name: Line
        type: int
        tags: {json: 'line'}
      - comment: 该行标题
        name: Title
        type: string
        tags: {json: 'title'}
      - comment: 失败原因
        name: Reason
        type: string
        tags: {json: 'reason'}
    withPlural: true

stores:
  - name: corpuStore
    embed: CorpuStoreX
    siname: Corpus
    hods:
      - { name: Document, type: LGCUD }
      - { name: DocVector, type: GCD }
      - { name: ChatLog, type: CGLD }
      - { name: ImportTask, type: LGCUD }

webcode: chi
webapi:
  formTag: form
  pkg: api
  needAuth: true
  uris:
    - model: Document
      prefix: '/api/corpus'
      ignore: C
