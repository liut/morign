definitions:
  Meta:
    type: object
    additionalProperties: {}
  aigc.HistoryChatItem:
    type: object
    properties:
      a:
        type: string
      th:
        description: reasoning/thinking content
        type: string
      u:
        type: string
  aigc.HistoryItem:
    type: object
    properties:
      ci:
        description: chat
        allOf:
          - $ref: '#/definitions/aigc.HistoryChatItem'
      ts:
        type: integer
      uid:
        type: string
  api.ChatMessage:
    type: object
    properties:
      csid:
        type: string
      delta:
        type: string
      finishReason:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
      text:
        type: string
      think:
        type: string
      title:
        type: string
      tool_call_id:
        description: For Role=tool prompts this should be set to the ID given in the assistant's prior request to call a tool.
        type: string
      tool_calls:
        description: For Role=assistant prompts this may be set to the tool calls generated by the model, such as function calls.
        type: array
        items:
          type: object
          additionalProperties: {}
  api.ChatRequest:
    type: object
    properties:
      csid:
        type: string
      mcps:
        type: array
        items:
          type: string
      options:
        description: 'deprecated: for github.com/Chanzhaoyu/chatgpt-web only'
        type: object
        properties:
          conversationId:
            type: string
      pmid:
        description: 'TODO: rename to PreviousMessageID'
        type: string
      prompt:
        type: string
      regen:
        type: boolean
      skills:
        description: 技能清单范围：仅圈定注入 system prompt 的技能元数据
        type: array
        items:
          type: string
      stream:
        type: boolean
  api.Done:
    type: object
    properties:
      extra:
        description: 附加数据,可选
      result:
        description: 主体数据,可选
      status:
        description: 状态值，0=ok
        type: integer
        example: 0
      t:
        description: 时间戳
        type: integer
  api.Failure:
    type: object
    properties:
      field:
        description: 错误字段,可选,多用于表单校验
        type: string
        example: 错误字段
      message:
        description: 错误信息
        type: string
        example: 错误信息
      status:
        description: 状态值
        type: integer
        example: 1
      t:
        description: 时间戳
        type: integer
  api.M:
    type: object
    additionalProperties: true
  api.ResultData:
    type: object
    properties:
      data:
        description: 数据集数组
      total:
        description: 符合条件的总记录数
        type: integer
  api.ResultID:
    type: object
    properties:
      id:
        description: 主键值，多数时候是字串
  api.SummaryRequest:
    type: object
    properties:
      text:
        type: string
      tips:
        type: string
  api.User:
    type: object
    properties:
      avatar:
        type: string
      hit:
        type: integer
      name:
        description: nickname, realname, display name
        type: string
      oid:
        description: pk id, objectID, see define in andvari
        type: string
      roles:
        type: array
        items:
          type: string
      tid:
        type: integer
      uid:
        description: username, login name
        type: string
      watching:
        type: array
        items:
          type: string
  api.corpusImportTaskView:
    type: object
    properties:
      createdAt:
        type: string
      errors:
        type: array
        items:
